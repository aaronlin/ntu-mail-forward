name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run offline tests
        run: uv run --locked python -m unittest discover -s tests
      - name: Check LaunchAgent syntax
        run: |
          zsh -n launchd/run_with_error_email.sh
          plutil -lint launchd/*.example.plist
      - name: Check generated LaunchAgents
        run: |
          uv run --locked python -m ntu_mail_forward.launchd_setup --render-only
          plutil -lint launchd/com.personal-automation.ntu-mail-forward.plist launchd/com.personal-automation.ntu-mail-forward-cleanup.plist
